<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Blog Preview Card</title>
</head>

<body>
  <main>
    <article>
      <div class="ilustration-container">
        <img class="card-ilustration" src="/images/illustration-article.svg" alt="">
      </div>
      <div class="details-container">
        <span class="card-label">Learning</span>
        <time class="card-date" datetime="2023-12-21">Published 21 Dec 2023</time>
        <h1 class="card-title">HTML & CSS foundations</h1>
        <p class="card-description">These languages are the backbone of every website, defining structure, content,
          and presentation.</p>
      </div>

      <div class="author-container">
        <img class="author-avatar" src="/images/image-avatar.webp" alt="Greg Hooper Profile Image">
        <p class="author-name">Greg Hooper</p>
      </div>
    </article>
  </main>

</body>

</html>
